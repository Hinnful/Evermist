name: Update proofs

# Proves every platform updates itself: install this version, walk it back to an older build and
# forward again through the Restart button. Each build gets a local feed baked in, since the app
# reads its feed from inside the build. release.yml calls it; a push to any `platformrig/**` branch
# runs it alone and ships nothing.
on:
  workflow_call:
  push:
    branches:
      - 'platformrig/**'

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            new: --win nsis
            old: --win nsis
            script: tools/win-update-proof.js
            run: ''
          # The Mac updates outside electron-updater (electron/macUpdate.js). The zip users
          # receive is universal; the older build is only something to walk back to, so the
          # runner's own arch is enough.
          - os: macos-latest
            new: --mac zip --universal
            old: --mac zip --arm64
            script: tools/mac-update-proof.js
            run: ''
          - os: ubuntu-latest
            new: --linux AppImage
            old: --linux AppImage
            script: tools/linux-update-proof.js
            run: xvfb-run -a -s "-screen 0 1024x768x24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs, and an AppImage needs
      # FUSE to mount itself.
      - name: Let Chromium sandbox itself, and AppImages mount
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y libfuse2t64

      # ⚠ The port must match FEED_PORT in all three proof scripts.
      - name: Point the update feed at this machine
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.publish=[{provider:'generic',url:'http://127.0.0.1:8765/'}];fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Build this version
        run: npx electron-builder ${{ matrix.new }} --publish never -c.directories.output=dist-new
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build an older version
        run: npx electron-builder ${{ matrix.old }} --publish never -c.directories.output=dist-old -c.extraMetadata.version=0.0.1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Walk the installed app back and forward
        run: ${{ matrix.run }} node ${{ matrix.script }} dist-new dist-old
