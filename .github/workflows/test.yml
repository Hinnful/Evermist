name: Tests

# Runs the unit suite on every push and pull request.
# Release builds have their own gate in release.yml; this one exists so a red
# suite is visible long before a tag is cut.
on:
  push:
    branches: ['**']   # branches only — a v* tag is release.yml's job
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the What's new list is read off the release commits

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The suite is pure Node and never launches the app, so the ~100MB
          # Electron binary is dead weight here. Do NOT set this in a job that
          # runs electron-builder — packaging needs the real binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # ⚠ Written before the suite, which checks it opens with package.json's version.
      - name: Write the What's new list
        run: node tools/build-changelog.js

      - name: Run the tests
        run: npm test

      - name: Run the linter
        run: npm run lint

  # The ratchet guards over the whole tree, beside the suite rather than after it.
  guards:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the guards
        run: node tools/check-guards.js
