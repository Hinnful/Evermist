name: Rig

# The rig's blocker set against the packaged app, one job per platform, no sharding. Windows and Mac
# run `blockers` (launch, prep, a table session, work kept); Linux runs `launch` only. All three
# block a release. release.yml and platformrig.yml call it, so the legs live here once.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The title is the platform; the caller's name makes it "Gate / Windows".
  rig:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NEVER dist/Evermist.exe - see the rig skill.
          - { label: Windows, os: windows-latest, build: '--win dir', exe: 'dist/win-unpacked/Evermist.exe', run: '', set: blockers }
          - { label: Mac, os: macos-latest, build: '--mac dir --universal', exe: 'dist/mac-universal/Evermist.app/Contents/MacOS/Evermist', run: '', set: blockers }
          # xvfb at the Windows runner's screen size, so every geometry check reads the same. The runner
          # has no GPU, so the app draws at 5fps under software GL: launch is all Linux can answer.
          - { label: Linux, os: ubuntu-latest, build: '--linux dir', exe: 'dist/linux-unpacked/evermist', run: 'xvfb-run -a -s "-screen 0 1024x768x24"', set: launch }
    runs-on: ${{ matrix.os }}
    # The rig abandons a scenario at its own limit; the build sits in front.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/build-changelog.js

      # The Google client, as gate.yml writes it, so the rig drives the build users get.
      - name: Write the Google client
        run: node tools/write-google-client.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs, and the app then exits
      # at launch.
      - name: Let Chromium sandbox itself
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # ⚠ THE GATE DRIVES THE PACKAGED APP, not the repo. A file missing from build.files works
      # under `npm start` and is simply absent from the package, where a missing stylesheet
      # renders unstyled rather than erroring.
      - name: Build the packaged app
        run: npx electron-builder ${{ matrix.build }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ⚠ ONE RERUN, ONLY FOR A MACHINE FAULT. A run whose app never started says nothing about the
      # app, so it goes once more on a fresh profile. Any other failure is red.
      - name: Drive the packaged app through the ${{ matrix.set }} set
        run: |
          set -o pipefail
          if ! ${{ matrix.run }} npm run rig -- ${{ matrix.set }} --exe "${{ matrix.exe }}" 2>&1 | tee rig-run.log; then
            if grep -q "could not start the app" rig-run.log; then
              echo "::warning::the app never started; running the set once more"
              ${{ matrix.run }} npm run rig -- ${{ matrix.set }} --exe "${{ matrix.exe }}"
            else
              exit 1
            fi
          fi

      # ⚠ A RED RUN KEEPS ITS EVIDENCE. The rig writes under the OS temp dir, which the job throws
      # away, so a flaky red used to leave nothing but its FAIL line.
      - name: Collect the rig's evidence
        if: failure()
        run: |
          ROOT="$(node -p "require('path').join(require('os').tmpdir(), 'evermist-rig')")"
          if command -v cygpath >/dev/null; then ROOT="$(cygpath -u "$ROOT")"; fi
          if [ -d "$ROOT" ]; then
            cd "$ROOT"
            find . -type f \( -name '*.log' -o -name '*.png' \) \
              ! -path '*IndexedDB*' ! -path '*Local Storage*' ! -path '*Session Storage*' \
              -exec sh -c 'mkdir -p "$0/$(dirname "$1")" && cp "$1" "$0/$1"' "$GITHUB_WORKSPACE/rig-evidence" {} \;
          fi

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: rig-evidence-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: rig-evidence/
          retention-days: 14
          if-no-files-found: warn
