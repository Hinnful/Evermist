name: Mac and Linux rig

# Drives the packaged Mac and Linux apps through the same smoke and regression sets the Windows
# gate runs. A push to any `platformrig/**` branch runs it alone and ships nothing. It joins the
# release gate after two clean runs.
on:
  workflow_call:
  push:
    branches:
      - 'platformrig/**'

permissions:
  contents: read

jobs:
  rig:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's own arch is enough: the rig drives app code, and the universal build
          # only glues two copies of it together.
          - os: macos-latest
            build: --mac dir --arm64
            exe: dist/mac-arm64/Evermist.app/Contents/MacOS/Evermist
            run: ''
          # xvfb at the Windows runner's screen size, so every geometry check reads the same.
          - os: ubuntu-latest
            build: --linux dir
            exe: dist/linux-unpacked/evermist
            run: xvfb-run -a -s "-screen 0 1024x768x24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs, and the app then exits
      # at launch.
      - name: Let Chromium sandbox itself
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the unpacked app
        run: npx electron-builder ${{ matrix.build }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Drive the packaged app through the smoke set
        run: ${{ matrix.run }} npm run rig -- --exe "${{ matrix.exe }}"

      - name: Drive the packaged app through the full regression set
        run: ${{ matrix.run }} npm run rig -- regression --exe "${{ matrix.exe }}"

      - name: Collect the rig's evidence
        if: failure()
        run: |
          ROOT="$(node -p "require('path').join(require('os').tmpdir(), 'evermist-rig')")"
          if [ -d "$ROOT" ]; then
            cd "$ROOT"
            find . -type f \( -name '*.log' -o -name '*.png' \) \
              ! -path '*IndexedDB*' ! -path '*Local Storage*' ! -path '*Session Storage*' \
              -exec sh -c 'mkdir -p "$0/$(dirname "$1")" && cp "$1" "$0/$1"' "$GITHUB_WORKSPACE/rig-evidence" {} \;
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rig-evidence-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: rig-evidence/
          retention-days: 14
          if-no-files-found: warn
