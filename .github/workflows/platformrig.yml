name: Platform rig

# A push to any `platformrig/**` branch: the three installers and the rig's blocker set on all three
# platforms, as a release runs them. Ships nothing and never lands. update-proofs.yml has its own
# trigger on the same branches.
on:
  push:
    branches:
      - 'platformrig/**'

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml
    secrets: inherit

  rig:
    name: Gate
    uses: ./.github/workflows/rig.yml
    secrets: inherit
