name: Gate

# The installers, one job per platform: builds the one users get and checks its update pointer.
# Callers run it beside the rig (rig.yml), which drives the packaged app through smoke and its share
# of the regression. The rig is never part of this file: a caller waits for every job here, and the
# Linux rig must not hold `land` (see release.yml). Linux's installer build blocks all the same,
# because publish uploads its AppImage and latest-linux.yml.
#
# ⚠ THE GATE DRIVES THE PACKAGED APP, not the repo. A file missing from build.files works under
# `npm start` and is simply absent from the installer, where a missing stylesheet renders unstyled
# rather than erroring. That class is invisible to every other check.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Build installer (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, flag: --win, meta: dist/latest.yml, name: dist-windows }
          - { label: Mac, os: macos-latest, flag: --mac, meta: dist/latest-mac.yml, name: dist-macos }
          - { label: Linux, os: ubuntu-latest, flag: --linux, meta: dist/latest-linux.yml, name: dist-linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the What's new list is read off the release commits and tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall fetches yt-dlp into vendor/. It fails hard on purpose: a soft failure would
      # ship an installer whose download button does nothing.
      - run: npm ci

      - name: Write the What's new list
        run: node tools/build-changelog.js

      - name: Build the installer
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # Unsigned by choice. Unset, the mac build fails looking for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the update pointer
        run: node tools/check-update-metadata.js ${{ matrix.meta }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
