name: Gate

# THE GATE, on all three platforms at once. One job per platform builds the installer users get and
# checks its update pointer; the rig (rig.yml) then drives the packaged app through smoke and its
# share of the regression, six shards on Windows and four on Mac and Linux, so the slowest platform
# finishes in minutes rather than half an hour.
#
# ⚠ WINDOWS AND MAC BLOCK THE RELEASE; LINUX'S RIG IS ADVISORY AND NOT PART OF THIS WORKFLOW WHEN
# release.yml CALLS IT. A caller waits for every job here, so a Linux rig job in this file would hold
# `land` for the slowest leg (software GL, 16 to 20 minutes) even though its failure never blocks.
# release.yml passes skip-linux and runs the Linux rig as its own job instead. Linux's installer
# build stays here and still blocks: publish uploads its AppImage and latest-linux.yml.
#
# A push to any `platformrig/**` branch runs this alone, ships nothing, and runs Linux as well.
#
# ⚠ THE GATE DRIVES THE PACKAGED APP, not the repo. A file missing from build.files works under
# `npm start` and is simply absent from the installer, where a missing stylesheet renders unstyled
# rather than erroring. That class is invisible to every other check.
on:
  workflow_call:
    inputs:
      skip-linux:
        description: the caller runs the Linux rig and the report itself, off the blocking path
        type: boolean
        default: false
  push:
    branches:
      - 'platformrig/**'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, flag: --win, meta: dist/latest.yml, name: dist-windows }
          - { os: macos-latest, flag: --mac, meta: dist/latest-mac.yml, name: dist-macos }
          - { os: ubuntu-latest, flag: --linux, meta: dist/latest-linux.yml, name: dist-linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the What's new list is read off the release commits and tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall fetches yt-dlp into vendor/. It fails hard on purpose: a soft failure would
      # ship an installer whose download button does nothing.
      - run: npm ci

      - name: Write the What's new list
        run: node tools/build-changelog.js

      - name: Build the installer
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # Unsigned by choice. Unset, the mac build fails looking for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the update pointer
        run: node tools/check-update-metadata.js ${{ matrix.meta }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  # The platforms that block.
  rig:
    uses: ./.github/workflows/rig.yml
    with:
      platforms: windows-latest macos-latest

  # Only for a push to platformrig/**; a release runs Linux from release.yml (see the top).
  rig-linux:
    if: ${{ !inputs.skip-linux }}
    uses: ./.github/workflows/rig.yml
    with:
      platforms: ubuntu-latest

  # Only when this workflow is the whole run. A release calls the same report after its own Linux job.
  report:
    needs: [rig, rig-linux]
    if: ${{ !cancelled() && !inputs.skip-linux }}
    uses: ./.github/workflows/rig-report.yml
