name: Rerun unstarted jobs

# A job GitHub never gives a machine ends cancelled or failed with no step run, annotated "The job
# was not acquired by Runner of type hosted even after multiple attempts". That says nothing about
# the change, so the run's red jobs go again after a pause, at most twice. A called job cannot
# rerun itself and a run still going cannot be rerun, so this waits for Build & Release to finish.
#
# ⚠ ONLY WHEN EVERY RED JOB NEVER STARTED. `--failed` reruns every red job, so one job that ran and
# failed anywhere in the run means no rerun at all, and that failure stays red.
# ⚠ A RUN THE DM CANCELLED concludes `cancelled`, and its queued jobs have no steps either. Only a
# `failure` run is looked at.
# ⚠ workflow_run reads this file from main, so an edit here acts only once it has landed.
on:
  workflow_run:
    workflows: [Build & Release]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    name: Rerun jobs that never got a machine
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write   # read the run's jobs and rerun them
      contents: read
    # ⚠ The branch name arrives through the environment, never interpolated into the script.
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # A job with no steps and no runner name never reached a machine; "Set up job" is a step.
      - name: Did every red job never start?
        id: look
        run: |
          gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" --paginate --jq '.jobs[]' > jobs.jsonl
          jq -r 'select(.conclusion != "success" and .conclusion != "skipped")
            | (if (.steps | length) == 0 and (.runner_name // "") == "" then "unstarted" else "ran" end)
              + "\t" + (.conclusion // .status) + "\t" + .name' jobs.jsonl | tee red.tsv
          if [ ! -s red.tsv ]; then
            echo "No red job. Nothing to rerun."
          elif grep -q '^ran' red.tsv; then
            echo "A job ran and failed, so the run stays red."
          else
            echo "rerun=true" >> "$GITHUB_OUTPUT"
          fi

      # The pause gives the runner pool time to free up. After it, leave the run alone if someone
      # reran it meanwhile or the branch moved on: an older commit's land would race the new one.
      - name: Wait, then rerun them
        if: steps.look.outputs.rerun == 'true'
        run: |
          sleep $((ATTEMPT * 300))
          NOW=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '"\(.run_attempt) \(.status)"')
          if [ "$NOW" != "$ATTEMPT completed" ]; then
            echo "The run moved on (attempt and status now: $NOW). Leaving it."
            exit 0
          fi
          HEAD=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)
          if [ "$HEAD" != "$SHA" ]; then
            echo "$BRANCH no longer points at $SHA. Leaving it."
            exit 0
          fi
          echo "::notice::attempt $ATTEMPT had jobs that never got a machine; rerunning them"
          gh run rerun "$RUN" --failed -R "$REPO"
