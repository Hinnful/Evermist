name: CI probe (throwaway)

# THROWAWAY. Answers whether the rig can run on a GitHub Actions runner at all, so the release
# gate in backlog item 72 can be sized. Delete this file and tools/rig/scenarios/ci-probe.js once
# it has answered.
#
# It NEVER runs on its own — no push trigger, no tag trigger. Pushing it to main changes nothing.
# To run it: Actions -> "CI probe (throwaway)" -> Run workflow.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    # Well above the rig's own 900s cap plus the build, so a slow set is reported BY the rig with
    # its own message rather than cut off by the job with none.
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall fetches yt-dlp into vendor/. It fails hard on purpose, so a broken fetch
      # stops the job here rather than shipping an installer whose download button does nothing.
      - name: Install dependencies
        run: npm ci

      - name: Confirm yt-dlp arrived
        run: Get-ChildItem vendor/yt-dlp | Format-Table Name, Length

      # --dir builds the unpacked app without making an NSIS installer, which is minutes faster
      # and carries the same packaged file set.
      - name: Build the unpacked app
        run: npx electron-builder --win --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Show what got packaged
        run: |
          Get-Item dist/win-unpacked/Evermist.exe | Format-List Name, Length
          Get-ChildItem dist/win-unpacked/resources | Format-Table Name, Length

      # The probe first, because it is one scenario and it names the cause when the runner cannot
      # run the app at all. Smoke after it would only time out with nothing to read.
      - name: Probe the runner
        run: npm run rig -- ci-probe --exe "dist/win-unpacked/Evermist.exe"

      # Only reached when the probe passes. Two questions in one run: do the layout-heavy
      # scenarios hold at the runner's 1008x681 DM window, and does the set fit the rig's own
      # 900s cap. A timeout answers the second one as surely as a pass does — the step's duration
      # is the measurement either way.
      - name: Run the regression set against the built app
        run: npm run rig -- regression --exe "dist/win-unpacked/Evermist.exe"
