<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; -webkit-user-select: none; user-select: none; cursor: default; }
  #card {
    position: absolute; inset: 0;
    border-radius: 18px;
    background:
      radial-gradient(120% 90% at 50% 32%, #26272b 0%, #1e1e21 55%, #141416 100%);
    border: 1px solid #2c2d31;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    opacity: 0; animation: fadeIn 0.45s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  #mark { width: 132px; height: 132px; filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.45)); }
  #wordmark { color: #e4e6ea; font-size: 30px; font-weight: 300; letter-spacing: 0.42em; margin-left: 0.42em; }
  #tagline { color: #8b9099; font-size: 12.5px; letter-spacing: 0.12em; margin-top: -8px; }
  #loader { width: 168px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 6px; }
  #loader::after {
    content: ""; display: block; height: 100%; width: 40%;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(139,144,153,0) 0%, #8b9099 50%, rgba(139,144,153,0) 100%);
    animation: sweep 1.25s ease-in-out infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
</style>
</head>
